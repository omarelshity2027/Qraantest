<script>
/* ===== طبقة البيانات (Firebase Realtime Database) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCcAw9uCR8YZKzfLrBWg5ZwjhzBj2CSWyI",
  authDomain: "qraan-eb167.firebaseapp.com",
  databaseURL: "https://qraan-eb167-default-rtdb.firebaseio.com",
  projectId: "qraan-eb167",
  storageBucket: "qraan-eb167.firebasestorage.app",
  messagingSenderId: "742225987824",
  appId: "1:742225987824:web:7b033870f0188b9b1c1a35",
  measurementId: "G-TLMPRRMDG3"
};
const clean=o=>JSON.parse(JSON.stringify(o));
const DB={
  D:{students:[],teachers:[],settings:{}},
  DEF:{name:'مسابقة حفظ القرآن الكريم',pass:60,org:'الجهة المنظمة',year:new Date().getFullYear(),minAge:5,maxAge:60,wh:50,wt:30,wp:20,levels:['القرآن الكريم كاملًا','ثلاثة أرباع القرآن','نصف القرآن','10 أجزاء','ربع القرآن','5 أجزاء','3 أجزاء','جزآن']},
  norm(k,o){if(k==='students'&&o.ev)o.ev.log=o.ev.log||[];return o},
  cp:'Q-',pre:'',offs:[],tok:0,
  fmt(n){return this.cp+String(n).padStart(4,'0')},
  ref(p){return this.db.ref(this.pre+p)},
  unwatch(){this.offs.forEach(([r,ev,f])=>r.off(ev,f));this.offs=[]},
  /* حجز n كود متسلسل (Transaction عشان محدش يستلم نفس الكود) */
  async codes(n){
    const mx=Math.max(0,...this.D.students.map(s=>+((String(s.code||'').match(/(\d+)$/)||[0,0])[1])));
    try{const r=await this.ref('counter').transaction(c=>Math.max(c||0,mx)+n);return r.snapshot.val()-n+1}catch(x){return mx+1}
  },
  /* ترحيل البيانات القديمة: ربط الطلاب بالمحفظ بالـ id + إعطاء أكواد */
  async migrate(){
    const A=this.D.students,T=this.D.teachers,u={};
    A.forEach(s=>{if(!s.teacherId&&s.teacher){const t=T.find(x=>nn(x.name)===nn(s.teacher));if(t){s.teacherId=t.id;u[this.pre+'students/'+s.id+'/teacherId']=t.id}}});
    const nc=A.filter(s=>!s.code).sort((a,b)=>(a.reg||'').localeCompare(b.reg||''));
    if(nc.length){const c0=await this.codes(nc.length);nc.forEach((s,i)=>{s.code=this.fmt(c0+i);u[this.pre+'students/'+s.id+'/code']=s.code})}
    if(Object.keys(u).length)this.w(()=>this.db.ref().update(u));
  },
  async load(c0){
    const tk=++this.tok;this.unwatch();
    if(!this.db){firebase.initializeApp(firebaseConfig);this.db=firebase.database()}
    this.pre=c0.pre;this.cp=c0.cp;this.DEF=c0.def;
    const [a,b,c]=await Promise.all(['students','teachers','settings'].map(k=>this.ref(k).once('value')));
    if(tk!==this.tok)return false;
    this.D.students=Object.values(a.val()||{}).map(x=>this.norm('students',x)).sort((x,y)=>(y.reg||'').localeCompare(x.reg||''));
    this.D.teachers=Object.values(b.val()||{});
    let s=c.val();
    if(!s||!s.name){s=clean(this.DEF);await this.ref('settings').set(s)}
    s.levels=s.levels||[];this.D.settings=s;
    await this.migrate();
    if(tk!==this.tok)return false;
    this.watch();return true;
  },
  watch(){
    ['students','teachers'].forEach(k=>{
      const up=x=>{const o=this.norm(k,x.val()),l=this.D[k],i=l.findIndex(z=>z.id===o.id);
        if(i<0)l.unshift(o);else if(JSON.stringify(l[i])!==JSON.stringify(o))l[i]=o;else return;this.redraw()};
      const r=this.ref(k),rm=x=>{const id=x.key,l=this.D[k],i=l.findIndex(z=>z.id===id);if(i>=0){l.splice(i,1);this.redraw()}};
      [['child_added',up],['child_changed',up],['child_removed',rm]].forEach(([ev,f])=>{r.on(ev,f);this.offs.push([r,ev,f])});
    });
    const sr=this.ref('settings'),sv=x=>{const s=x.val();if(s){s.levels=s.levels||[];this.D.settings=s;this.redraw()}};
    sr.on('value',sv);this.offs.push([sr,'value',sv]);
  },
  redraw(){clearTimeout(this._t);this._t=setTimeout(()=>{
    if(['eval','import','settings'].includes(st.v))return;
    if(st.v==='students')renderList();else if(st.v==='teachers')tl('');else if(st.v==='reports')rep();else if(st.v==='ranks')rk();else draw()},400)},
  get(k){return this.D[k]},
  set(k,v){
    const old=this.D[k];this.D[k]=v;
    if(k==='settings'){this.save();return}
    const om=new Map(old.map(x=>[x.id,JSON.stringify(x)])),u={};
    v.forEach(x=>{if(om.get(x.id)!==JSON.stringify(x))u[this.pre+k+'/'+x.id]=clean(x);om.delete(x.id)});
    om.forEach((_,id)=>u[this.pre+k+'/'+id]=null);
    if(Object.keys(u).length)this.w(()=>this.db.ref().update(u));
  },
  save(){this.w(()=>this.ref('settings').set(clean(this.D.settings)))},
  w(f){f().catch(()=>tst('حدث خطأ أثناء حفظ البيانات، حاول مرة أخرى',1))}
};
/* ===== خدمات المنطق ===== */
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dg=s=>String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');
const nn=s=>String(s||'').replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
/* تاريخ الميلاد من الرقم القومي المصري (14 رقم) */
const nb=n=>{n=dg(n);if(n.length!==14||!/^[23]/.test(n))return'';const m=n.slice(3,5),d=n.slice(5,7);return+m>=1&&+m<=12&&+d>=1&&+d<=31?`${n[0]==='2'?'19':'20'}${n.slice(1,3)}-${m}-${d}`:''};
const age=s=>{const b=s.birth||nb(s.nid);if(!b)return'';const a=Math.floor((Date.now()-new Date(b))/31557600000);return isNaN(a)?'':a};
const ST=()=>DB.get('settings'),SS=()=>DB.get('students'),TS=()=>DB.get('teachers');
const W=()=>{const s=ST();return{hifz:s.wh??50,tajweed:s.wt??30,perf:s.wp??20}};
const calc=sc=>{const w=W();return Math.round((sc.hifz*w.hifz+sc.tajweed*w.tajweed+sc.perf*w.perf)/(w.hifz+w.tajweed+w.perf)*10)/10};
const tids=s=>s.teacherIds&&s.teacherIds.length?s.teacherIds:(s.teacherId?[s.teacherId]:[]);
const tnl=s=>{const a=tids(s).map(i=>(TS().find(t=>t.id===i)||{}).name).filter(Boolean);return a.length?a:(s.teacher?[s.teacher]:[])};
const tn=s=>tnl(s).join('، ');
const gr=s=>{const g=gen(s);return g==='ذكر'?0:g==='أنثى'?1:2};
const cmp=(a,b)=>gr(a)-gr(b)||nn(a.name).localeCompare(nn(b.name),'ar');
const ofT=t=>SS().filter(s=>tids(s).includes(t.id)||(!tids(s).length&&s.teacher===t.name));
const ls=k=>{try{return localStorage.getItem(k)||''}catch(x){return''}};
const stat=s=>!s.ev?'لم يتم التقييم':s.ev.pct>=ST().pass?'ناجح':'غير ناجح';
const cls=s=>({'ناجح':'ok','غير ناجح':'no'}[stat(s)]||'mu');
const gen=s=>s.gender||(dg(s.nid).length===14?(+dg(s.nid)[12]%2?'ذكر':'أنثى'):'');
const isDark=()=>{const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches};
function toggleTheme(){const t=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('qc_theme',t)}catch(x){}$('#thm').textContent=isDark()?'☀ نهاري':'☾ ليلي'}
let _uc=0;const uid=p=>p+Date.now().toString(36)+(_uc++).toString(36)+Math.random().toString(36).slice(2,4);
const S={
  dupN(nid,ex){const i=dg(nid);return i&&SS().find(s=>s.id!==ex&&dg(s.nid)===i)},
  dupName(name,ex){const n=nn(name);return n&&SS().find(s=>s.id!==ex&&nn(s.name)===n)},
  /* التكرار الحقيقي = نفس الرقم القومي فقط. الاسم المتشابه تنبيه مش منع */
  async saveStudent(x,force){const i=dg(x.nid),d=S.dupN(i,x.id);if(d)return{dup:d};
    if(!force){const w=[],a=age(x),s=ST();
      if(i&&i.length!==14)w.push('الرقم القومي ليس 14 رقمًا');
      if(a!==''&&((s.minAge&&a<s.minAge)||(s.maxAge&&a>s.maxAge)))w.push(`العمر (${a}) خارج النطاق المسموح (${s.minAge}–${s.maxAge})`);
      const n=S.dupName(x.name,x.id);if(n)w.push(`يوجد طالب بنفس الاسم: ${n.name} (${n.code||n.id}) برقم قومي مختلف أو غير مسجل`);
      if(w.length)return{warns:w}}

  if(r.warns){if(confirm('تنبيه:\n• '+r.warns.join('\n• ')+'\n\nهل تريد الحفظ رغم ذلك؟'))return commitStu(true);return}

  if(typeof v==='number'&&v>10000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const s=String(v||'').trim(),m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:/^\d{4}-\d{2}-\d{2}$/.test(s)?s:''};
function impFile(f){if(!f)return;const rd=new FileReader();rd.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const seenN={},seenI={};st.imp=rows.map(r=>{const x={name:String(r['الاسم']||'').trim(),nid:dg(r['الرقم القومي']),birth:xd(r['تاريخ الميلاد']),teacher:String(r['المحفظ']||'').trim(),level:String(r['المستوى']||'').trim(),phone:String(r['رقم الهاتف']||'').trim(),gov:String(r['المحافظة']||'').trim(),center:String(r['المركز']||'').trim(),notes:String(r['ملاحظات']||'').trim(),gender:String(r['النوع']||'').trim()};
    x.birth=x.birth||nb(x.nid);

    x.w=x.s==='جديد'&&n&&(S.dupName(x.name)||seenN[n]);
    if(x.s==='جديد'){if(n)seenN[n]=1;if(x.nid)seenI[x.nid]=1}return x});
  const ok=st.imp.filter(x=>x.s==='جديد').length,wn=st.imp.filter(x=>x.w).length;
  $('#ip').innerHTML=`<p>جديد: ${ok} — مكرر/ناقص: ${st.imp.length-ok}${wn?` — <span class="wr">${wn} باسم مشابه (هيتستوردوا، راجعهم)</span>`:''}</p><div class="tw"><table><tr><th>الاسم</th><th>الرقم القومي</th><th>المحفظ</th><th>المستوى</th><th>الحالة</th></tr>${st.imp.slice(0,100).map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.nid)}</td><td>${e(x.teacher)}</td><td>${e(x.level)}</td><td class="${x.s!=='جديد'?'no':x.w?'wr':'ok'}">${x.s==='جديد'&&x.w?'جديد (اسم مشابه)':x.s}</td></tr>`).join('')}</table></div>${st.imp.length>100?'<p class="mu">معروض أول 100 صف فقط، والاستيراد يشمل الكل.</p>':''}<button class="p" style="margin-top:10px" onclick="impOk()">تأكيد استيراد ${ok} طالب</button>`}catch(x){tst('تعذر قراءة الملف، تأكد من صيغته',1)}};rd.readAsArrayBuffer(f)}
async function impOk(){const rows=(st.imp||[]).filter(x=>x.s==='جديد').map(({s,w,...x})=>x);st.imp=null;if(!rows.length)return;

  rows.forEach(x=>{const ids=[],nm=[];x.teacher.split(/[،,؛;\/+|\n]/).map(z=>z.trim()).filter(Boolean).forEach(n=>{let t=TS().find(t=>nn(t.name)===nn(n))||nt.find(t=>nn(t.name)===nn(n));if(!t){t={id:uid('T'),name:n,phone:'',status:'نشط',notes:''};nt.push(t)}if(!ids.includes(t.id)){ids.push(t.id);nm.push(t.name)}});
    if(ids.length){x.teacherIds=ids;x.teacherId=ids[0];x.teacher=nm.join('، ')}

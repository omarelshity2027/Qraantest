<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1c2a22;--mu:#6b7a70;--g:#14532d;--g2:#1f7a45;--gx:#14532d;--au:#b8912f;--bd:#e2e6e0;--ok:#166534;--no:#b91c1c;--wr:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--card:#18211c;--tx:#e8eee9;--mu:#98a89d;--g:#1f7a45;--g2:#2a9d5c;--gx:#4ade80;--bd:#2a362f;--ok:#4ade80;--no:#f87171;--wr:#fbbf24}}

*{box-sizing:border-box}html,body{margin:0}body{font-family:Tajawal,Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}

nav h2{font-size:15px;color:var(--gx);margin:0 0 12px}
nav a{display:flex;gap:10px;padding:11px 10px;border-radius:10px;cursor:pointer;color:var(--tx)}
nav a.on{background:var(--g);color:#fff}nav a:hover:not(.on){background:var(--bg)}
main{flex:1;padding:18px;max-width:1100px;margin:auto;width:100%;min-width:0}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.row .f{flex:1 1 200px}

<div id="md"><div id="mb"></div></div><div id="ts"><span id="tx"></span></div><button id="fab" title="إضافة طالب" aria-label="إضافة طالب" onclick="stuForm()">+</button><div id="pr"></div>
<script>
/* ===== طبقة البيانات (Firebase Realtime Database) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCcAw9uCR8YZKzfLrBWg5ZwjhzBj2CSWyI",
  authDomain: "qraan-eb167.firebaseapp.com",
  databaseURL: "https://qraan-eb167-default-rtdb.firebaseio.com",
  projectId: "qraan-eb167",
  storageBucket: "qraan-eb167.firebasestorage.app",
  messagingSenderId: "742225987824",
  appId: "1:742225987824:web:7b033870f0188b9b1c1a35",
  measurementId: "G-TLMPRRMDG3"
};
const clean=o=>JSON.parse(JSON.stringify(o));
const DB={
  D:{students:[],teachers:[],settings:{}},
  DEF:{name:'مسابقة حفظ القرآن الكريم',pass:60,org:'الجهة المنظمة',year:new Date().getFullYear(),minAge:5,maxAge:60,wh:50,wt:30,wp:20,levels:['القرآن الكريم كاملًا','ثلاثة أرباع القرآن','نصف القرآن','10 أجزاء','ربع القرآن','5 أجزاء','3 أجزاء','جزآن']},
  norm(k,o){if(k==='students'&&o.ev)o.ev.log=o.ev.log||[];return o},
  cp:'Q-',pre:'',offs:[],tok:0,
  fmt(n){return this.cp+String(n).padStart(4,'0')},
  ref(p){return this.db.ref(this.pre+p)},
  unwatch(){this.offs.forEach(([r,ev,f])=>r.off(ev,f));this.offs=[]},
  /* حجز n كود متسلسل (Transaction عشان محدش يستلم نفس الكود) */
  async codes(n){
    const mx=Math.max(0,...this.D.students.map(s=>+((String(s.code||'').match(/(\d+)$/)||[0,0])[1])));
    try{const r=await this.ref('counter').transaction(c=>Math.max(c||0,mx)+n);return r.snapshot.val()-n+1}catch(x){return mx+1}
  },
  /* ترحيل البيانات القديمة: ربط الطلاب بالمحفظ بالـ id + إعطاء أكواد */
  async migrate(){
    const A=this.D.students,T=this.D.teachers,u={};
    A.forEach(s=>{if(!s.teacherId&&s.teacher){const t=T.find(x=>nn(x.name)===nn(s.teacher));if(t){s.teacherId=t.id;u[this.pre+'students/'+s.id+'/teacherId']=t.id}}});
    const nc=A.filter(s=>!s.code).sort((a,b)=>(a.reg||'').localeCompare(b.reg||''));
    if(nc.length){const c0=await this.codes(nc.length);nc.forEach((s,i)=>{s.code=this.fmt(c0+i);u[this.pre+'students/'+s.id+'/code']=s.code})}
    if(Object.keys(u).length)this.w(()=>this.db.ref().update(u));
  },
  async load(c0){
    const tk=++this.tok;this.unwatch();
    if(!this.db){firebase.initializeApp(firebaseConfig);this.db=firebase.database()}
    this.pre=c0.pre;this.cp=c0.cp;this.DEF=c0.def;
    const [a,b,c]=await Promise.all(['students','teachers','settings'].map(k=>this.ref(k).once('value')));
    if(tk!==this.tok)return false;
    this.D.students=Object.values(a.val()||{}).map(x=>this.norm('students',x)).sort((x,y)=>(y.reg||'').localeCompare(x.reg||''));
    this.D.teachers=Object.values(b.val()||{});
    let s=c.val();
    if(!s||!s.name){s=clean(this.DEF);await this.ref('settings').set(s)}
    s.levels=s.levels||[];this.D.settings=s;
    await this.migrate();
    if(tk!==this.tok)return false;
    this.watch();return true;
  },
  watch(){
    ['students','teachers'].forEach(k=>{
      const up=x=>{const o=this.norm(k,x.val()),l=this.D[k],i=l.findIndex(z=>z.id===o.id);
        if(i<0)l.unshift(o);else if(JSON.stringify(l[i])!==JSON.stringify(o))l[i]=o;else return;this.redraw()};
      const r=this.ref(k),rm=x=>{const id=x.key,l=this.D[k],i=l.findIndex(z=>z.id===id);if(i>=0){l.splice(i,1);this.redraw()}};
      [['child_added',up],['child_changed',up],['child_removed',rm]].forEach(([ev,f])=>{r.on(ev,f);this.offs.push([r,ev,f])});
    });
    const sr=this.ref('settings'),sv=x=>{const s=x.val();if(s){s.levels=s.levels||[];this.D.settings=s;this.redraw()}};
    sr.on('value',sv);this.offs.push([sr,'value',sv]);
  },
  redraw(){clearTimeout(this._t);this._t=setTimeout(()=>{
    if(['eval','import','settings'].includes(st.v))return;
    if(st.v==='students')renderList();else if(st.v==='teachers')tl('');else if(st.v==='reports')rep();else if(st.v==='ranks')rk();else draw()},400)},
  get(k){return this.D[k]},
  set(k,v){
    const old=this.D[k];this.D[k]=v;
    if(k==='settings'){this.save();return}
    const om=new Map(old.map(x=>[x.id,JSON.stringify(x)])),u={};
    v.forEach(x=>{if(om.get(x.id)!==JSON.stringify(x))u[this.pre+k+'/'+x.id]=clean(x);om.delete(x.id)});
    om.forEach((_,id)=>u[this.pre+k+'/'+id]=null);
    if(Object.keys(u).length)this.w(()=>this.db.ref().update(u));
  },
  save(){this.w(()=>this.ref('settings').set(clean(this.D.settings)))},
  w(f){f().catch(()=>tst('حدث خطأ أثناء حفظ البيانات، حاول مرة أخرى',1))}
};
/* ===== خدمات المنطق ===== */
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dg=s=>String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');
const nn=s=>String(s||'').replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
/* تاريخ الميلاد من الرقم القومي المصري (14 رقم) */
const nb=n=>{n=dg(n);if(n.length!==14||!/^[23]/.test(n))return'';const m=n.slice(3,5),d=n.slice(5,7);return+m>=1&&+m<=12&&+d>=1&&+d<=31?`${n[0]==='2'?'19':'20'}${n.slice(1,3)}-${m}-${d}`:''};
const age=s=>{const b=s.birth||nb(s.nid);if(!b)return'';const a=Math.floor((Date.now()-new Date(b))/31557600000);return isNaN(a)?'':a};
const ST=()=>DB.get('settings'),SS=()=>DB.get('students'),TS=()=>DB.get('teachers');
const W=()=>{const s=ST();return{hifz:s.wh??50,tajweed:s.wt??30,perf:s.wp??20}};
const calc=sc=>{const w=W();return Math.round((sc.hifz*w.hifz+sc.tajweed*w.tajweed+sc.perf*w.perf)/(w.hifz+w.tajweed+w.perf)*10)/10};
const tn=s=>{const t=s.teacherId&&TS().find(x=>x.id===s.teacherId);return t?t.name:(s.teacher||'')};
const ofT=t=>SS().filter(s=>s.teacherId===t.id||(!s.teacherId&&s.teacher===t.name));
const ls=k=>{try{return localStorage.getItem(k)||''}catch(x){return''}};
const stat=s=>!s.ev?'لم يتم التقييم':s.ev.pct>=ST().pass?'ناجح':'غير ناجح';
const cls=s=>({'ناجح':'ok','غير ناجح':'no'}[stat(s)]||'mu');
const gen=s=>s.gender||(dg(s.nid).length===14?(+dg(s.nid)[12]%2?'ذكر':'أنثى'):'');
const isDark=()=>{const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches};
function toggleTheme(){const t=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('qc_theme',t)}catch(x){}$('#thm').textContent=isDark()?'☀ نهاري':'☾ ليلي'}
let _uc=0;const uid=p=>p+Date.now().toString(36)+(_uc++).toString(36)+Math.random().toString(36).slice(2,4);
const S={
  dupN(nid,ex){const i=dg(nid);return i&&SS().find(s=>s.id!==ex&&dg(s.nid)===i)},
  dupName(name,ex){const n=nn(name);return n&&SS().find(s=>s.id!==ex&&nn(s.name)===n)},
  /* التكرار الحقيقي = نفس الرقم القومي فقط. الاسم المتشابه تنبيه مش منع */
  async saveStudent(x,force){const i=dg(x.nid),d=S.dupN(i,x.id);if(d)return{dup:d};
    if(!force){const w=[],a=age(x),s=ST();
      if(i&&i.length!==14)w.push('الرقم القومي ليس 14 رقمًا');
      if(a!==''&&((s.minAge&&a<s.minAge)||(s.maxAge&&a>s.maxAge)))w.push(`العمر (${a}) خارج النطاق المسموح (${s.minAge}–${s.maxAge})`);
      const n=S.dupName(x.name,x.id);if(n)w.push(`يوجد طالب بنفس الاسم: ${n.name} (${n.code||n.id}) برقم قومي مختلف أو غير مسجل`);
      if(w.length)return{warns:w}}
    x.nid=i;
    if(x.id){DB.set('students',SS().map(s=>s.id===x.id?{...s,...x}:s))}
    else{x.id=uid('S');x.code=DB.fmt(await DB.codes(1));x.reg=new Date().toISOString();x.status='مسجل';DB.set('students',[x,...SS()])}
    return{ok:x}},
  del(id){DB.set('students',SS().filter(s=>s.id!==id))},
  saveEval(id,v){DB.set('students',SS().map(s=>{if(s.id!==id)return s;const old=s.ev,log=(old?.log||[]).concat(old?[{pct:old.pct,by:old.by,at:old.at}]:[]);return{...s,ev:{...v,at:new Date().toISOString(),log}}}))},
  /* حذف المكرر بالرقم القومي فقط، مع نسخة احتياطية تلقائية */
  dedupe(){const seen={},out=[];let rm=0;
    const all=[...SS()].sort((a,b)=>(b.ev?1:0)-(a.ev?1:0));
    all.forEach(s=>{const i=dg(s.nid);if(i&&seen[i]){rm++;return}if(i)seen[i]=1;out.push(s)});
    if(rm){backup('dedupe');DB.set('students',out)}return rm},
  search(q,f={}){const tk=nn(q).toLowerCase().split(' ').filter(Boolean).map(t=>/^[0-9٠-٩]+$/.test(t)?dg(t):t);
    return SS().filter(s=>{
      if(tk.length){const h=nn([s.name,tn(s),s.gov,s.center,s.code].join(' ')).toLowerCase()+' '+String(s.id).toLowerCase()+' '+String(s.code||'').toLowerCase()+' '+dg(s.nid)+' '+dg(s.phone);if(!tk.every(t=>h.includes(t)))return false}
      return(!f.teacher||s.teacherId===f.teacher)&&(!f.level||s.level===f.level)&&(!f.gender||gen(s)===f.gender)&&(!f.gov||nn(s.gov).includes(nn(f.gov)))&&
      (!f.st||(f.st==='ناجح'&&stat(s)==='ناجح')||(f.st==='غير ناجح'&&stat(s)==='غير ناجح')||(f.st==='لم يتم التقييم'&&!s.ev))&&
      (f.min===''||f.min==null||(s.ev&&s.ev.pct>=+f.min))&&(f.max===''||f.max==null||(s.ev&&s.ev.pct<=+f.max))&&
      (!f.amin||age(s)>=+f.amin)&&(!f.amax||age(s)<=+f.amax)&&(!f.d1||(s.ev&&s.ev.at.slice(0,10)>=f.d1))&&(!f.d2||(s.ev&&s.ev.at.slice(0,10)<=f.d2))})},
  /* رسالة واتساب: بدون الرقم القومي (بيانات حساسة) */
  wa(s){let p=dg(s.phone);if(!p)return tst('لا يوجد رقم هاتف للطالب',1);if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p='20'+p.slice(1);
    const v=s.ev,m=[`*${ST().name}*`,`الاسم: ${s.name}`,`الكود: ${s.code||s.id}`,`المحفظ: ${tn(s)||'-'}`,`المستوى: ${s.level||'-'}`];
    if(v){m.push(`النسبة النهائية: ${v.pct}%`,`الحالة: ${stat(s)}`);[['general','ملاحظات عامة'],['tajweed','التجويد'],['perf','القراءة والأداء'],['hifz','الحفظ'],['other','أخرى']].forEach(([k,l])=>v[k]&&m.push(`${l}: ${v[k]}`));m.push(`تاريخ التقييم: ${new Date(v.at).toLocaleString('ar-EG')}`)}else m.push('الحالة: لم يتم التقييم بعد');
    window.open(`https://wa.me/${p}?text=${encodeURIComponent(m.join('\n'))}`,'_blank')}
};
/* ===== نسخ احتياطي ===== */
function backup(t){const j={at:new Date().toISOString(),students:SS(),teachers:TS(),settings:ST()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(j)],{type:'application/json'}));a.download=`backup-${CUR.id}-${t||'manual'}-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=ev=>{try{const j=JSON.parse(ev.target.result);if(!Array.isArray(j.students)||!Array.isArray(j.teachers))throw 0;window._rs=j;
  modal(`<h3>استعادة نسخة احتياطية</h3><p>سيتم استبدال البيانات الحالية بالنسخة (${j.students.length} طالب، ${j.teachers.length} محفظ). هتتنزل نسخة من البيانات الحالية أولًا.</p><div class="row"><button class="p" onclick="restoreGo()">استعادة</button><button onclick="closeM()">إلغاء</button></div>`)}catch(x){tst('ملف النسخة غير صالح',1)}};r.readAsText(f)}
async function restoreGo(){const j=window._rs,m=a=>Object.fromEntries(a.map(x=>[x.id,clean(x)]));backup('before-restore');
  try{await DB.db.ref().update({[DB.pre+'students']:m(j.students),[DB.pre+'teachers']:m(j.teachers),[DB.pre+'settings']:clean(j.settings||ST())});closeM();tst('تمت الاستعادة');go('home')}catch(x){tst('فشلت الاستعادة، حاول مرة أخرى',1)}}
/* ===== واجهة ===== */
let st={v:'home',id:null,q:'',pg:0,f:{},sf:{},imp:null,rl:'',rn:3};
const tst=(t,er)=>{const x=$('#tx');x.textContent=t;x.className=er?'er':'';x.style.display='inline-block';clearTimeout(tst.t);tst.t=setTimeout(()=>x.style.display='none',3200)};
const modal=h=>{$('#mb').innerHTML=h;$('#md').style.display='flex'},closeM=()=>$('#md').style.display='none';
const conf=(msg,fn)=>{window._cf=()=>{closeM();fn()};modal(`<h3>هل أنت متأكد؟</h3><p>${msg}</p><div class="row"><button class="p d" style="background:var(--no);color:#fff" onclick="_cf()">تأكيد</button><button onclick="closeM()">إلغاء</button></div>`)};
const go=(v,id)=>{st.v=v;st.id=id||null;scrollTo(0,0);draw()};

student(){const s=SS().find(x=>x.id===st.id);if(!s)return'<p>الطالب غير موجود</p>';const v=s.ev;

teachers(){return`<div class="row"><h2 class="f">المحفظون</h2><button class="p" onclick="tForm()">+ إضافة محفظ</button></div><div class="card"><input placeholder="بحث عن محفظ" oninput="tl(this.value)"><div id="tl"></div></div>`},

import(){return`<h2>استيراد Excel</h2><div class="card"><p class="mu">الأعمدة: الاسم، الرقم القومي، تاريخ الميلاد (اختياري، يُستخرج من الرقم القومي)، المحفظ، المستوى، رقم الهاتف، المحافظة، المركز، ملاحظات، النوع (اختياري)</p><input type="file" accept=".xlsx,.xls,.csv" onchange="impFile(this.files[0])"><div id="ip"></div></div>`},
settings(){const s=ST(),dw={wh:50,wt:30,wp:20};return`<h2>الإعدادات</h2><div class="card"><h3>إعدادات المسابقة</h3><div class="grid">${[['name','اسم المسابقة'],['org','الجهة المنظمة'],['year','سنة المسابقة'],['pass','نسبة النجاح %'],['minAge','الحد الأدنى للعمر'],['maxAge','الحد الأقصى للعمر']].map(([k,l])=>`<div><label>${l}</label><input id="s_${k}" value="${e(s[k])}"></div>`).join('')}</div>
  <h3>أوزان معايير التقييم (المجموع 100)</h3><div class="grid">${[['wh','الحفظ %'],['wt','التجويد %'],['wp','القراءة والأداء %']].map(([k,l])=>`<div><label>${l}</label><input id="s_${k}" type="number" value="${e(s[k]??dw[k])}"></div>`).join('')}</div><button class="p" style="margin-top:12px" onclick="saveSet()">حفظ الإعدادات</button></div>
  <div class="card"><h3>المستويات</h3>${s.levels.map((l,i)=>`<div class="row" style="margin-top:6px"><input class="f" value="${e(l)}" onchange="lvl(${i},'r',this.value)"><button onclick="lvl(${i},'u')">▲</button><button onclick="lvl(${i},'d')">▼</button><button class="d" onclick="conf('سيتم حذف هذا المستوى من القائمة (الطلاب المسجلون فيه يحتفظون باسم المستوى).',()=>lvl(${i},'x'))">حذف</button></div>`).join('')}<button style="margin-top:10px" onclick="lvl(0,'a')">+ إضافة مستوى</button></div>
  <div class="card"><h3>نسخة احتياطية</h3><p class="mu">نزّل نسخة قبل أي عملية كبيرة. الحذف الشامل وحذف المكررات والاستعادة بتنزّل نسخة تلقائيًا.</p><div class="row"><button class="p" onclick="backup('manual')">تنزيل نسخة احتياطية</button><label class="btn" style="margin:0;cursor:pointer">استعادة من ملف<input type="file" accept=".json" hidden onchange="restore(this.files[0]);this.value=''"></label></div></div>
  <div class="card"><h3 class="no">منطقة الخطر</h3><p class="mu">حذف جميع الطلاب والمحفظين نهائيًا (مع تنزيل نسخة احتياطية تلقائيًا).</p><button class="d" onclick="wipeAll()">حذف كل البيانات</button></div>`}

function renderList(){const r=S.search(st.q,st.sf),n=20,p=r.slice(st.pg*n,st.pg*n+n);
  $('#ls').innerHTML=(p.map(s=>`<div class="s"><div><b style="cursor:pointer" onclick="go('student','${s.id}')">${e(s.name)}</b><div class="mu">${e(s.code||'')} — ${e(s.level)} — ${gen(s)||'—'} — <span class="${cls(s)}">${stat(s)}${s.ev?' '+s.ev.pct+'%':''}</span></div></div>
  <div class="row"><button class="p" onclick="go('eval','${s.id}')">تقييم الطالب</button><button onclick="go('student','${s.id}')">فتح</button><button class="w" onclick="S.wa(SS().find(x=>x.id==='${s.id}'))">واتساب</button></div></div>`).join('')||'<p class="mu">لا توجد نتائج</p>')+
  `<div class="row" style="margin-top:10px"><span class="mu f">${r.length} طالب</span><button ${st.pg?'':'disabled'} onclick="st.pg--;renderList()">السابق</button><button ${(st.pg+1)*n<r.length?'':'disabled'} onclick="st.pg++;renderList()">التالي</button></div>`}
function stuForm(id){const s=id?SS().find(x=>x.id===id):{};const i=(k,l,t)=>`<label>${l}</label><input id="f_${k}" type="${t||'text'}" value="${e(s[k]||'')}">`;
  const tid=s.teacherId||(TS().find(t=>t.name===s.teacher)||{}).id;
  modal(`<h3>${id?'تعديل الطالب':'إضافة طالب'}</h3>${i('name','الاسم بالكامل')}${i('nid','الرقم القومي')}${i('birth','تاريخ الميلاد (يُملأ تلقائيًا من الرقم القومي)','date')}<label>النوع</label><select id="f_gender"><option value="">تلقائي من الرقم القومي</option><option value="ذكر" ${s.gender==='ذكر'?'selected':''}>ذكر</option><option value="أنثى" ${s.gender==='أنثى'?'selected':''}>أنثى</option></select><label>المحفظ</label><select id="f_teacher"><option value="">— بدون —</option>${tsel(tid)}</select><label>المستوى</label><select id="f_level">${opt(ST().levels,s.level)}</select>${i('phone','رقم الهاتف','tel')}${i('gov','المحافظة')}${i('center','المركز / المدينة')}${i('notes','ملاحظات إدارية')}
  <div class="row" style="margin-top:14px"><button class="p" onclick="saveStu('${id||''}')">حفظ</button><button onclick="closeM()">إلغاء</button></div>`);
  $('#f_nid').oninput=()=>{const b=$('#f_birth');if(!b.value){const v=nb($('#f_nid').value);if(v)b.value=v}}}
function saveStu(id){const x={id:id||undefined};['name','nid','birth','phone','gov','center','notes','gender'].forEach(k=>x[k]=$('#f_'+k).value.trim());
  x.teacherId=$('#f_teacher').value;x.teacher=(TS().find(t=>t.id===x.teacherId)||{}).name||'';x.level=$('#f_level').value;
  x.gender=x.gender||gen(x);x.birth=x.birth||nb(x.nid);
  if(!x.name)return tst('يرجى إدخال اسم الطالب',1);
  window._px=x;commitStu(false)}
async function commitStu(force){const x=window._px,isNew=!x.id;let r;
  try{r=await S.saveStudent(x,force)}catch(er){return tst('حدث خطأ أثناء الحفظ، حاول مرة أخرى',1)}
  if(r.dup){closeM();tst('الرقم القومي مسجل بالفعل لطالب آخر',1);return go('student',r.dup.id)}
  if(r.warns){if(confirm('تنبيه:\n• '+r.warns.join('\n• ')+'\n\nهل تريد الحفظ رغم ذلك؟'))return commitStu(true);return}
  closeM();tst(isNew?'تم حفظ الطالب بنجاح':'تم تعديل بيانات الطالب');go('student',r.ok.id)}
function delStu(id){conf('هل أنت متأكد من حذف هذا الطالب؟ سيتم حذف بياناته ونتيجته.',()=>{S.del(id);tst('تم حذف الطالب');go('students')})}
function rmDup(){conf('سيتم حذف السجلات المكررة بنفس الرقم القومي فقط (مع الإبقاء على الذي له تقييم)، وسيتم تنزيل نسخة احتياطية تلقائيًا. الأسماء المتشابهة لا تُحذف.',()=>{const n=S.dedupe();tst(n?`تم حذف ${n} سجل مكرر`:'لا توجد سجلات مكررة بنفس الرقم القومي');renderList()})}
function calcPct(){const ks=['hifz','tajweed','perf'],g=k=>$('#e_s_'+k).value;if(ks.some(k=>g(k)===''||isNaN(g(k))))return $('#e_pct').textContent='—';$('#e_pct').textContent=calc({hifz:+g('hifz'),tajweed:+g('tajweed'),perf:+g('perf')})}
function saveEv(id){const sc={};
  for(const k of['hifz','tajweed','perf']){const p=$('#e_s_'+k).value;if(p===''||isNaN(p)||+p<0||+p>100)return tst('أدخل درجات صحيحة بين 0 و100 للمعايير الثلاثة',1);sc[k]=+p}
  const by=$('#e_by').value.trim();if(!by)return tst('اكتب اسم المقيّم',1);try{localStorage.setItem('qc_by',by)}catch(x){}
  const v={pct:calc(sc),sc,by};['general','tajweed','perf','hifz','other'].forEach(k=>v[k]=$('#e_'+k).value.trim());
  S.saveEval(id,v);tst('تم حفظ تقييم الطالب بنجاح');go('student',id)}
function tl(q){q=nn(q);$('#tl').innerHTML=TS().filter(t=>!q||nn(t.name).includes(q)).map(t=>`<div class="s"><div><b>${e(t.name)}</b><div class="mu">${e(t.phone)} — ${e(t.status)} — ${ofT(t).length} طالب</div></div><div class="row"><button onclick="tView('${t.id}')">طلابه</button><button onclick="tForm('${t.id}')">تعديل</button><button class="d" onclick="delT('${t.id}')">حذف</button></div></div>`).join('')}
function delT(id){const t=TS().find(x=>x.id===id),n=ofT(t).length;
  conf(`هل أنت متأكد من حذف المحفظ؟${n?` له ${n} طالب، وسيبقون مسجلين بدون ربط بمحفظ (اسم المحفظ يفضل ظاهر في بياناتهم).`:''}`,()=>{
    if(n)DB.set('students',SS().map(s=>s.teacherId===id?{...s,teacherId:'',teacher:t.name}:s));
    DB.set('teachers',TS().filter(x=>x.id!==id));tst('تم حذف المحفظ');tl('')})}
function tView(id){const t=TS().find(x=>x.id===id);modal(`<h3>طلاب ${e(t.name)}</h3>`+(ofT(t).map(s=>`<div class="s"><a onclick="closeM();go('student','${s.id}')">${e(s.name)}</a><span class="${cls(s)}">${stat(s)}${s.ev?' '+s.ev.pct+'%':''}</span></div>`).join('')||'<p class="mu">لا يوجد طلاب</p>')+`<button style="margin-top:10px" onclick="closeM()">إغلاق</button>`)}
function tForm(id){const t=id?TS().find(x=>x.id===id):{};const i=(k,l)=>`<label>${l}</label><input id="t_${k}" value="${e(t[k]||'')}">`;
  modal(`<h3>${id?'تعديل محفظ':'إضافة محفظ'}</h3>${i('name','الاسم')}${i('phone','رقم الهاتف')}<label>الحالة</label><select id="t_status">${opt(['نشط','غير نشط'],t.status)}</select>${i('notes','ملاحظات')}<div class="row" style="margin-top:14px"><button class="p" onclick="saveT('${id||''}')">حفظ</button><button onclick="closeM()">إلغاء</button></div>`)}
function saveT(id){const x={name:$('#t_name').value.trim(),phone:$('#t_phone').value.trim(),status:$('#t_status').value,notes:$('#t_notes').value.trim()};if(!x.name)return tst('يرجى إدخال اسم المحفظ',1);
  if(TS().some(t=>t.id!==id&&nn(t.name)===nn(x.name)))return tst('المحفظ مسجل بالفعل',1);

const xd=v=>{if(v instanceof Date&&!isNaN(v))return new Date(v.getTime()-v.getTimezoneOffset()*60000+432e5).toISOString().slice(0,10);
  if(typeof v==='number'&&v>10000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const s=String(v||'').trim(),m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:/^\d{4}-\d{2}-\d{2}$/.test(s)?s:''};
function impFile(f){if(!f)return;const rd=new FileReader();rd.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const seenN={},seenI={};st.imp=rows.map(r=>{const x={name:String(r['الاسم']||'').trim(),nid:dg(r['الرقم القومي']),birth:xd(r['تاريخ الميلاد']),teacher:String(r['المحفظ']||'').trim(),level:String(r['المستوى']||'').trim(),phone:String(r['رقم الهاتف']||'').trim(),gov:String(r['المحافظة']||'').trim(),center:String(r['المركز']||'').trim(),notes:String(r['ملاحظات']||'').trim(),gender:String(r['النوع']||'').trim()};
    x.birth=x.birth||nb(x.nid);
    x.gender=/أنث|انث|بنت/.test(x.gender)?'أنثى':/ذكر|ولد|بنين/.test(x.gender)?'ذكر':gen(x);const n=nn(x.name);
    x.s=!x.name?'ناقص: الاسم':(x.nid&&(S.dupN(x.nid)||seenI[x.nid]))?'مكرر (رقم قومي)':'جديد';
    x.w=x.s==='جديد'&&n&&(S.dupName(x.name)||seenN[n]);
    if(x.s==='جديد'){if(n)seenN[n]=1;if(x.nid)seenI[x.nid]=1}return x});
  const ok=st.imp.filter(x=>x.s==='جديد').length,wn=st.imp.filter(x=>x.w).length;
  $('#ip').innerHTML=`<p>جديد: ${ok} — مكرر/ناقص: ${st.imp.length-ok}${wn?` — <span class="wr">${wn} باسم مشابه (هيتستوردوا، راجعهم)</span>`:''}</p><div class="tw"><table><tr><th>الاسم</th><th>الرقم القومي</th><th>المحفظ</th><th>المستوى</th><th>الحالة</th></tr>${st.imp.slice(0,100).map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.nid)}</td><td>${e(x.teacher)}</td><td>${e(x.level)}</td><td class="${x.s!=='جديد'?'no':x.w?'wr':'ok'}">${x.s==='جديد'&&x.w?'جديد (اسم مشابه)':x.s}</td></tr>`).join('')}</table></div>${st.imp.length>100?'<p class="mu">معروض أول 100 صف فقط، والاستيراد يشمل الكل.</p>':''}<button class="p" style="margin-top:10px" onclick="impOk()">تأكيد استيراد ${ok} طالب</button>`}catch(x){tst('تعذر قراءة الملف، تأكد من صيغته',1)}};rd.readAsArrayBuffer(f)}
async function impOk(){const rows=(st.imp||[]).filter(x=>x.s==='جديد').map(({s,w,...x})=>x);st.imp=null;if(!rows.length)return;
  const nt=[];
  rows.forEach(x=>{if(x.teacher){let t=TS().find(t=>nn(t.name)===nn(x.teacher))||nt.find(t=>nn(t.name)===nn(x.teacher));if(!t){t={id:uid('T'),name:x.teacher,phone:'',status:'نشط',notes:''};nt.push(t)}x.teacherId=t.id;x.teacher=t.name}
    if(x.level&&!ST().levels.includes(x.level))ST().levels.push(x.level)});
  const c0=await DB.codes(rows.length),now=new Date().toISOString();
  const n=rows.map((x,i)=>({...x,id:uid('S'),code:DB.fmt(c0+i),reg:now,status:'مسجل'}));
  if(nt.length)DB.set('teachers',[...TS(),...nt]);DB.save();DB.set('students',[...n,...SS()]);tst(`تم استيراد ${n.length} طالب`);go('students')}

 {id:'main',pre:'',cp:'Q-',label:'مسابقة القرآن الكريم',def:DB.DEF},
